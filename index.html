<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Budget Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid var(--bg-color);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result-row.total {
            font-weight: bold;
            font-size: 20px;
            color: var(--primary);
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Event Budget Calculator</h1>

    <div class="form-group">
        <label for="eventType">Тип події</label>
        <select id="eventType">
            <option value="birthday">День народження</option>
            <option value="wedding">Весілля</option>
            <option value="corporate">Корпоратив</option>
            <option value="meeting">Зустріч / Вечірка</option>
        </select>
    </div>

    <div class="form-group">
        <label for="guests">Кількість гостей</label>
        <input type="number" id="guests" value="20" min="1">
    </div>

    <div class="form-group">
        <label for="food">Їжа на 1 особу (₴)</label>
        <input type="number" id="food" value="500" min="0">
    </div>

    <div class="form-group">
        <label for="drinks">Напої на 1 особу (₴)</label>
        <input type="number" id="drinks" value="200" min="0">
    </div>

    <div class="form-group">
        <label for="venue">Оренда локації (₴)</label>
        <input type="number" id="venue" value="5000" min="0">
    </div>

    <div class="form-group">
        <label for="decor">Декор (₴)</label>
        <input type="number" id="decor" value="2000" min="0">
    </div>

    <div class="form-group">
        <label for="entertainment">Розваги / Ведучий (₴)</label>
        <input type="number" id="entertainment" value="3000" min="0">
    </div>

    <div class="form-group">
        <label for="other">Інші витрати (₴)</label>
        <input type="number" id="other" value="1000" min="0">
    </div>

    <div class="form-group">
        <label for="buffer">Резервний запас (%)</label>
        <input type="number" id="buffer" value="10" min="0" max="100">
    </div>

    <div class="results">
        <div class="result-row">
            <span>Основні витрати:</span>
            <span id="baseCost">0 ₴</span>
        </div>
        <div class="result-row">
            <span>Резервний фонд:</span>
            <span id="bufferCost">0 ₴</span>
        </div>
        <div class="result-row total">
            <span>Загальний бюджет:</span>
            <span id="totalCost">0 ₴</span>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('input, select');

    function calculateBudget() {
        const guests = parseFloat(document.getElementById('guests').value) || 0;
        const food = parseFloat(document.getElementById('food').value) || 0;
        const drinks = parseFloat(document.getElementById('drinks').value) || 0;
        const venue = parseFloat(document.getElementById('venue').value) || 0;
        const decor = parseFloat(document.getElementById('decor').value) || 0;
        const entertainment = parseFloat(document.getElementById('entertainment').value) || 0;
        const other = parseFloat(document.getElementById('other').value) || 0;
        const bufferPercent = parseFloat(document.getElementById('buffer').value) || 0;

        const cateringCost = guests * (food + drinks);
        const baseCost = cateringCost + venue + decor + entertainment + other;
        const bufferCost = baseCost * (bufferPercent / 100);
        const totalCost = baseCost + bufferCost;

        document.getElementById('baseCost').textContent = baseCost.toLocaleString() + ' ₴';
        document.getElementById('bufferCost').textContent = bufferCost.toLocaleString() + ' ₴';
        document.getElementById('totalCost').textContent = totalCost.toLocaleString() + ' ₴';
    }

    inputs.forEach(input => {
        input.addEventListener('input', calculateBudget);
    });

    calculateBudget();
</script>

</body>
</html>
